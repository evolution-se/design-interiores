<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-inner">
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
<header class="site-header">
  <div class="container-wide">
    <a href="index.html" class="logo" aria-label="Atelier Norte — página inicial">
      <div class="logo-mark">
        <span class="logo-monogram" aria-hidden="true">AN</span>
        <span class="logo-title">Atelier Norte</span>
      </div>
      <span class="logo-subtitle">Arquitetura & Interiores</span>
    </a>
    <nav class="site-nav" aria-label="Navegação principal">
      <a class="nav-link" href="index.html#estudio">O Estúdio</a>
      <a class="nav-link" href="index.html#portfolio">Portfólio</a>
      <a class="nav-link" href="index.html#servicos">Serviços</a>
      <a class="nav-link" href="index.html#contato">Contato</a>
    </nav>
    <a href="https://wa.me/5511999999999" class="btn-brand" data-whatsapp-message="Olá! Gostaria de solicitar um orçamento de projeto de arquitetura ou interiores.">Solicitar orçamento</a>
  </div>
</header>
<main id="conteudo" class="section">
  <div class="container-wide" id="projetoContainer">
    <p>Carregando projeto…</p>
  </div>
</main>
<footer class="site-footer">
  <div class="container-wide">
    <div class="footer-bottom">
      <span>© <span id="year"></span> Atelier Norte.</span>
      <a href="index.html">Voltar ao site</a>
    </div>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="js/projetos.js"></script>
<script src="js/script.js"></script>
<script>
(function(){
  var container = document.getElementById('projetoContainer');
  function render(){
    var slug = (location.hash || '').replace('#','') || 'residencia-aurora';
    var p = (window.PROJETOS || []).find(function(x){ return x.slug === slug; });
    if(!p){ container.innerHTML = '<p>Projeto não encontrado. <a href="index.html#portfolio">Voltar ao portfólio</a></p>'; return; }
    document.title = p.titulo + ' | Atelier Norte';
    var imgs = p.imagens.map(function(s){ return '<div class="img-placeholder" style="margin-bottom:1.5rem;"><img src="'+s+'" alt="Imagem ilustrativa '+p.titulo+'" class="img-fade" style="width:100%;height:auto;" loading="lazy"></div>'; }).join('');
    var escopo = p.escopo.map(function(e){ return '<li>'+e+'</li>'; }).join('');
    container.innerHTML =
      '<a href="index.html#portfolio" class="link-underline" style="margin-bottom:2rem;display:inline-flex;position:relative;"><i class="bi bi-arrow-left"></i> Voltar ao portfólio</a>' +
      '<span class="eyebrow section-eyebrow">'+p.categoria+'</span>' +
      '<h1 style="margin-bottom:1rem;">'+p.titulo+'</h1>' +
      '<p class="meta" style="margin-bottom:2rem;">'+p.cidade+' · '+p.ano+'</p>' +
      '<div style="max-width:760px;margin-bottom:2rem;"><p class="lead">'+p.descricao+'</p></div>' +
      imgs +
      '<div style="margin-top:2rem;"><h3 style="margin-bottom:1rem;">Escopo do projeto</h3><ul style="list-style:disc;padding-left:1.25rem;color:var(--color-muted);">'+escopo+'</ul></div>' +
      '<div style="margin-top:3rem;"><a href="https://wa.me/5511999999999" class="btn-brand" data-whatsapp-message="Olá! Tenho interesse no projeto '+p.titulo+'.">Solicitar orçamento similar</a></div>';
    // re-apply whatsapp links
    if(window.applyWhatsAppLinks) window.applyWhatsAppLinks();
    document.querySelectorAll('img.img-fade').forEach(function(img){ if(img.complete) img.classList.add('is-loaded'); else img.addEventListener('load',function(){ img.classList.add('is-loaded');});});
  }
  render();
  window.addEventListener('hashchange', render);
  document.getElementById('year').textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
